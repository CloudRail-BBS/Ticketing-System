# 客户端文案（简体中文）。
#
# 键集必须与 client.en.yml 完全一致：前端只会做 `i18n("ticketing_system.…")`
# 这一种查询，缺一个键就会在界面上直接渲染成
# `[zh_CN.ticketing_system.…]` 这样的方括号串——看到方括号就说明是这里漏了键。
#
# `js:` 这层包装是必需的。客户端文件会被合并进 JS bundle，由 `I18n` 从
# `js` 命名空间下读取；少了这层包装，所有客户端查询都会落空，而服务端查询却
# 照常工作，症状非常具有迷惑性。
#
# 文件名必须是 `client<任意后缀>.<locale>.yml`——核心用
# `Dir["plugins/*/config/locales/client*.#{locale}.yml"]` 收集客户端 bundle。
zh_CN:
  js:
    ticketing_system:
      title: "工单"
      nav_label: "工单"
      heading: "支持工单"
      description: "提交一张工单，支持团队会尽快回复你。"
      loading: "正在加载工单…"
      count:
        one: "%{count} 张工单"
        other: "%{count} 张工单"

      # 与 server.zh_CN.yml 重复是刻意的：两份文件由两个不同的 I18n 实例读取
      # （服务端 `I18n.t` 与客户端 `i18n`），只在服务端文件里存在的键会在浏览器里
      # 渲染成原始键名。客户端需要它们是因为通知渲染器只拿到一个裸状态名
      # （`"resolved"`），没有别的办法把它变成人话。
      status:
        open: "待处理"
        in_progress: "处理中"
        pending: "等待用户回复"
        resolved: "已解决"
        closed: "已关闭"

      priority:
        low: "低"
        normal: "普通"
        high: "高"
        urgent: "紧急"

      empty:
