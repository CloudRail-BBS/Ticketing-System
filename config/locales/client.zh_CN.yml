      # 通知条目的文案。
      #
      # 这里只有**短语**，不含 `%{username}`。通知条目会把发言人名字渲染在前面的
      # 一个 label 里，description 里再写一遍就会变成
      # 「alice alice 提交了一张工单」。见
      # assets/javascripts/discourse/lib/notification-type.js。
      #
      # `%{status}` 是唯一需要的占位符，且只有 status_changed 用得到。
      # 渲染器总会传一个 `status`（事件不带时传空串），因为 Discourse 的 i18n
      # 把 undefined 视为「缺少插值参数」，会渲染成字面的
      # "[missing %{status} value]"。
