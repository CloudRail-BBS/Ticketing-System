          created: "Department created."
          updated: "Department saved."
          deleted: "Department deleted."

      # Notification item text.
      #
      # These are the PHRASE only — no `%{username}`. The notification item
      # renders the acting user's name in a separate `label` span before the
      # description, so a `%{username}` here would print the name twice
      # ("alice alice opened a ticket"). See
      # assets/javascripts/discourse/lib/notification-type.js.
      #
      # `%{status}` is the only placeholder any of them needs, and only
      # `status_changed` has it. The renderer always passes a `status` key
      # (empty string when the event carries none) because Discourse's i18n
      # treats `undefined` as a missing interpolation and renders the literal
      # "[missing %{status} value]".
      #
      # `sla_breached*` and `auto_closed` are the exception to the "phrase"
      # rule: they are written by the scheduled jobs, so there is no acting user
      # and the label span renders empty. A phrase with no subject ("missed a
      # deadline") would read as a fragment, so these three are standalone
      # sentences.
      notifications:
        new_ticket: "opened a ticket"
        requester_reply: "replied to a ticket"
        staff_reply: "replied to your ticket"
        assigned: "assigned a ticket to you"
        status_changed: "marked the ticket %{status}"
        sla_breached: "Overdue: this ticket has passed its service-level deadline"
        sla_breached_first_response: "Overdue: nobody has replied to this ticket yet"
        sla_breached_resolution: "Overdue: this ticket is past its resolution deadline"
        auto_closed: "This ticket was closed automatically after being resolved"
