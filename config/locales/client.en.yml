# Client-side strings.
#
# The `js:` wrapper is MANDATORY. Client files are merged into the JS bundle and
# read by `i18n("ticketing_system.…")`; without the wrapper every lookup fails and
# the UI renders `[en.ticketing_system.…]` instead of text. The bracket form also
# tells you which locale was active, which is the quickest way to confirm this.
#
# Filename must be `client<something>.<locale>.yml` — core collects the bundle with
# `Dir["plugins/*/config/locales/client*.#{locale}.yml"]`. A file named
# `frontend.en.yml` would load server-side only and every client lookup would miss.
en:
  js:
    ticketing_system:
      title: "Tickets"
      nav_label: "Tickets"
      heading: "Support tickets"
      description: "Open a ticket and the support team will get back to you."
      loading: "Loading tickets…"
      count:
        one: "%{count} ticket"
        other: "%{count} tickets"

      # Duplicated from server.en.yml on purpose. The two files are read by two
      # different I18n instances: server-side `I18n.t("ticketing_system.status.open")`
      # and client-side `i18n("ticketing_system.status.open")`. A key that exists
      # only in the server file renders as a raw key in the browser.
      #
      # The client needs these for the notification renderer, which is handed a
      # bare status name (`"resolved"`) from the notification's data payload and
      # has no other way to turn it into words.
      status:
        open: "Open"
        in_progress: "In progress"
        pending: "Waiting on requester"
        resolved: "Resolved"
        closed: "Closed"

      priority:
        low: "Low"
        normal: "Normal"
        high: "High"
        urgent: "Urgent"

      empty:
        mine: "You have no tickets yet."
        all: "There are no tickets."
        filtered: "No tickets match these filters."
        hint: "Try clearing a filter, or open a new ticket."

      filters:
        scope: "View"
        status: "Status"
        priority: "Priority"
        department: "Department"
        sort: "Sort"
        search: "Search"
        search_placeholder: "Search title, number, user or message"
        all: "All"
        any: "Any"
        clear: "Clear"
        unread_only: "Unread only"
        active_filters: "Filtered"

      scopes:
